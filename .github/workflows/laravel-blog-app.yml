name: laravel-blog-app E2E

on:
  push:
    branches: [main]
    paths:
      - 'laravel-blog-app/**'
      - '.github/workflows/laravel-blog-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'laravel-blog-app/**'
  schedule:
    - cron: '0 6 * * *'

defaults:
  run:
    working-directory: laravel-blog-app

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-blog-app-playwright-report
          path: laravel-blog-app/playwright-report/
          retention-days: 14